###
# This workflow aims to build and push an image of the connector to Docker Hub.
#
# - It is to be used when OpenCTI did not yet merge a PR for a new version.
# - When use the format "<current-opencti-version>-beta" as "docker_tag" value.
# - See also the config of GitHub variables and secrets for this repo.
###

name: Build and push (external-import)

# Trigger condition: Only manually in this case
on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: Version tag to use for the generated Docker image
        required: true

# Jobs definition: One for external-import and one for internal-enrichment
jobs:
  build:
    name: build-external-import-release
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout the branch
        uses: actions/checkout@v2
        with:
          ref: ${{ vars.BUILD_EXTERNALIMPORT_BRANCH }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ${{ vars.BUILD_EXTERNALIMPORT_PATH }}
          no-cache: true
          provenance: mode=max
          push: true
          sbom: true
          tags: '${{ vars.DOCKERHUB_IMAGE_EXTERNALIMPORT }}:${{ github.event.inputs.docker_tag }}'